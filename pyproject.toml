[project]
name = "arbite"
version = "0.1.0"
description = "File-based ticketing system for git repos and AI agents"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
]

[project.scripts]
arbite = "arbite.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
