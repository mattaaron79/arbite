[project]
name = "arbite"
version = "0.2.0"
description = "Pluggable ticket-sink system for git repos and AI agents (files by default, SQLite optional)"
requires-python = ">=3.9"
dependencies = [
    "pyyaml",
]

[project.optional-dependencies]
# Development only. The runtime dependency list stays at pyyaml: the SQLite sink
# uses the stdlib sqlite3 module, so `pipx install arbite` gains nothing to fetch.
dev = [
    "pytest>=7",
]

[project.scripts]
arbite = "arbite.cli:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Tests import arbite from the checkout rather than a site-packages copy, so an
# editable install is not required to run them.
pythonpath = ["src"]
